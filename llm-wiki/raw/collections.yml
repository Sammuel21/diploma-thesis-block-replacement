schema_version: 1
updated: 2026-07-17
path_base: repository-root

collections:
  - id: primary-papers
    title: Supervisor-curated primary paper collection
    locations:
      - ../resources/direct
    include: "*.pdf"
    recursive: false
    storage: external-local
    origin: supervisor-provided
    evidence_kinds:
      - scholarly-primary
    priority: core
    mutability: immutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Papers selected directly by the supervisor as core thesis sources.

  - id: secondary-papers
    title: Researcher-curated secondary paper collection
    locations:
      - ../resources
    include: "*.pdf"
    recursive: false
    storage: external-local
    origin: researcher-found
    evidence_kinds:
      - scholarly-primary
      - scholarly-secondary
    priority: supporting
    mutability: immutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Additional papers found by the researcher; academic evidence kind is assigned per source.

  - id: researcher-idea-inbox
    title: Researcher-authored idea inbox
    locations:
      - ../ideas
    recursive: true
    storage: external-local
    origin: researcher-authored
    evidence_kinds:
      - researcher-note
    priority: exploratory
    mutability: mutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Original ideas and informal notes; never treat them as prior work.
