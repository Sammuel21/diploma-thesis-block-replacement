schema_version: 1
updated: 2026-10-17
path_base: repository-root

collections:
  - id: primary-papers
    title: Supervisor-curated primary paper collection
    locations:
      - ../resources/direct
    include: "*.pdf"
    recursive: false
    storage: external-local
    origin: supervisor-provided
    evidence_kinds:
      - scholarly-primary
    priority: core
    mutability: immutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Papers selected directly by the supervisor as core thesis sources.

  - id: secondary-papers
    title: Researcher-curated secondary paper collection
    locations:
      - ../resources
    include: "*.pdf"
    recursive: false
    storage: external-local
    origin: researcher-found
    evidence_kinds:
      - scholarly-primary
      - scholarly-secondary
    priority: supporting
    mutability: immutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Additional papers found by the researcher; academic evidence kind is assigned per source.

  - id: researcher-idea-inbox
    title: Researcher-authored idea inbox
    locations:
      - ../ideas
    recursive: true
    storage: external-local
    origin: researcher-authored
    evidence_kinds:
      - researcher-note
    priority: exploratory
    mutability: mutable
    ingestion_policy: one-at-a-time-reviewed
    notes: Original ideas and informal notes; never treat them as prior work.

  - id: evaluation-references
    title: Canonical evaluation benchmarks and pinned software
    locations:
      - https://arxiv.org
      - https://github.com/EleutherAI/lm-evaluation-harness
    storage: remote
    origin: external-other
    evidence_kinds:
      - scholarly-primary
      - software
    priority: supporting
    mutability: immutable-snapshot
    ingestion_policy: selective-with-source-verification
    notes: Bibliographic registration for implemented evaluation; no source ingestion is implied.

  - id: quantization-references
    title: Pinned quantization software and official runtime documentation
    locations:
      - https://github.com/pytorch/ao
      - https://github.com/meta-pytorch/MSLK
      - https://download.pytorch.org/whl/cu128/mslk/
      - https://docs.pytorch.org
    storage: remote
    origin: external-other
    evidence_kinds: [software, official-documentation]
    priority: supporting
    mutability: mixed
    ingestion_policy: selective-with-source-verification
    notes: Quantization-1 backend registration; pinned source APIs and selected documentation locators checked, without full source ingestion.

  - id: recovery-references
    title: Original recovery and adaptation method references
    locations:
      - https://arxiv.org
    storage: remote
    origin: external-other
    evidence_kinds: [scholarly-primary]
    priority: supporting
    mutability: immutable-snapshot
    ingestion_policy: selective-with-source-verification
    notes: Original method citations for implemented recovery variants and local-fitting training choices; selected sections checked, without implying full paper ingestion.

  - id: quantization-method-references
    title: Original weight-quantization method references
    locations:
      - https://arxiv.org
    storage: remote
    origin: external-other
    evidence_kinds: [scholarly-primary]
    priority: supporting
    mutability: immutable-snapshot
    ingestion_policy: selective-with-source-verification
    notes: Original method citations for Stacking-1's quantization-aware training and for its stated limits of round-to-nearest INT3; selected sections checked, without implying full paper ingestion.

  - id: allocation-method-references
    title: Layer-wise compression allocation method references
    locations:
      - https://arxiv.org
    storage: remote
    origin: external-other
    evidence_kinds: [scholarly-primary]
    priority: supporting
    mutability: immutable-snapshot
    ingestion_policy: selective-with-source-verification
    notes: Prior methods that allocate per-layer compression levels under a global budget, cited as the inspiration for the discrete width allocator; selected sections checked, without implying full paper ingestion.
